name: Validate and publish Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated build to the separate Pages repository
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      repository: ${{ steps.pages.outputs.repository }}
      branch: ${{ steps.pages.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: |
          if [ "$(npm --version)" != "11.19.1" ]; then npm install --global npm@11.19.1; fi
          npm ci
      - name: Check types and formatting
        run: |
          npm run check
          npm run format:check
      - name: Run content and routing tests
        run: npm test
      - name: Resolve separate Pages target
        id: pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          TARGET: ${{ vars.PAGES_REPOSITORY }}
          BRANCH: ${{ vars.PAGES_BRANCH }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Publishing must run from the source repository default branch."
            exit 1
          fi
          if [[ "${GITHUB_REPOSITORY,,}" != "ke1thli/ke1thli-blog" || "$TARGET" != "Ke1thLi/Ke1thLi-Blog-Pages" || "$BRANCH" != "gh-pages" ]]; then
            echo "::error::Publishing requires the confirmed repositories and gh-pages branch."
            exit 1
          fi
          printf 'BLOG_SITE_URL=https://ke1thli.github.io\nBLOG_BASE_PATH=/Ke1thLi-Blog-Pages/\n' >> "$GITHUB_ENV"
          printf 'repository=%s\nbranch=%s\n' "$TARGET" "$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Build and verify static artifact
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          BLOG_GITHUB_URL: ${{ vars.BLOG_GITHUB_URL }}
        run: |
          npm run build
          for file in index.html 404.html robots.txt rss.xml sitemap.xml pagefind/pagefind.js; do
            test -f "dist/$file" || { echo "::error::Missing dist/$file"; exit 1; }
          done
          if find dist \( -type l -o -name .git -o -name .env -o -name '.env.*' -o -name node_modules -o -name CNAME \) -print -quit | grep -q .; then
            echo "::error::Unexpected file in the public artifact."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pages-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish && needs.validate.outputs.repository != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    environment: pages-publish
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pages-dist
          path: artifact
      - name: Create target-only installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PAGES_APP_CLIENT_ID }}
          private-key: ${{ secrets.PAGES_APP_PRIVATE_KEY }}
          owner: Ke1thLi
          repositories: Ke1thLi-Blog-Pages
          permission-contents: write
      - name: Check out the separate publishing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ needs.validate.outputs.repository }}
          ref: ${{ needs.validate.outputs.branch }}
          token: ${{ steps.app-token.outputs.token }}
          path: publish
      - name: Publish validated static files
        env:
          BRANCH: ${{ needs.validate.outputs.branch }}
          COMMIT_EMAIL: ${{ vars.PAGES_COMMIT_EMAIL }}
        run: |
          if [[ ! -f artifact/index.html || ! -f artifact/404.html || ! -d publish/.git ]]; then
            echo "::error::The Pages artifact or publishing checkout is incomplete."
            exit 1
          fi
          if [[ -z "$COMMIT_EMAIL" || -e publish/CNAME || -L publish/CNAME ]]; then
            echo "::error::Set PAGES_COMMIT_EMAIL and use an artifact-only branch without CNAME."
            exit 1
          fi
          rsync -a --delete --exclude='/.git/' artifact/ publish/
          touch publish/.nojekyll
          git -C publish config user.name 'Ke1thLi Blog deployment'
          git -C publish config user.email "$COMMIT_EMAIL"
          git -C publish add --all
          if git -C publish diff --cached --quiet; then
            echo "The publishing branch already contains this build."
            exit 0
          fi
          git -C publish commit -m "Publish source ${GITHUB_SHA::12}"
          git -C publish push origin "HEAD:refs/heads/$BRANCH"
